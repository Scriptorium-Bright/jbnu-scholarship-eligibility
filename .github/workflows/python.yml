name: Python CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'alembic/**'
      - 'docker/Dockerfile'
      - '.github/workflows/python.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'alembic/**'
      - 'docker/Dockerfile'
      - '.github/workflows/python.yml'

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: jbnu_scholarship_test
          POSTGRES_USER: jbnu
          POSTGRES_PASSWORD: jbnu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jbnu -d jbnu_scholarship_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      JBNU_ENV: test
      JBNU_DATABASE_URL: postgresql+psycopg://jbnu:jbnu@localhost:5432/jbnu_scholarship_test
      JBNU_RAW_STORAGE_PATH: /tmp/raw

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -e '.[dev]'

      - name: Run pytest
        run: pytest --tb=short -q
